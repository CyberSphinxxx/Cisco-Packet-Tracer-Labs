name: Validate Repository

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Run Offline Validator and Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Repository Static Validator
        run: |
          python tools/validate_repo.py --root .
