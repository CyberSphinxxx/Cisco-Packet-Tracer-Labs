name: Validate Repository

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Run Offline Validator and Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Repository Static Validator
        run: |
          python tools/validate_repo.py --root .

  site:
    name: Build and Test Website (site/)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      # No production origin in CI: builds are noindex and emit no sitemap.
      PTL_SITE_URL: ''

    steps:
      - name: Checkout repository (full content is required at build time)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-10-28)

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-10-28)
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Type check (astro check)
        run: npm run check

      - name: Unit and content integration tests
        run: npm test

      - name: Production build (Astro, Pagefind, security headers)
        run: npm run build

      - name: Audit built output (pages, links, fragments, download bytes, inventory)
        run: npm run verify:dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the built site
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (resolved 2026-10-28)
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
